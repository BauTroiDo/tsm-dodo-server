# Cấu hình JVM cho Gradle Daemon
# JAVA_HOME được thiết lập động bởi start_servers.bat / TSM_Launcher.bat,nơi đây không hardcode nữa.
# Nếu cần chạy gradlew trực tiếp,hãy đặt biến môi trường JAVA_HOME trỏ tới JDK 21.
org.gradle.jvmargs=-Xmx1024m
org.gradle.console=plain
org.gradle.parallel=true
org.gradle.caching=true
