server {
    port = 6613
    port = ${?SERVER_PORT}
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
}

database {
    url = "jdbc:mysql://192.168.1.69:3307/tsm_dodo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8"
    url = ${?DB_URL}
    driver = "com.mysql.cj.jdbc.Driver"
    user = "root"
    user = ${?DB_USER}
    password = ""
    password = ${?DB_PASSWORD}
    maximumPoolSize = 10
}

game {
    heartbeatInterval = 20
    clientVersion = 258
    # Mặc định dùng đường dẫn tương đối(phân giải bởi Gradle workingDir=rootProject.projectDir)
    # Nếu cần ghi đè,hãy đặt biến môi trường GAMEDATA_PATH thành đường dẫn tuyệt đối
    gamedataPath = "cdn/mirror/tsr/2.4.76/ResourcesPacked"
    gamedataPath = ${?GAMEDATA_PATH}
    serverDataPath = "gamedata"
    serverDataPath = ${?SERVER_DATA_PATH}
}


# Production profile: custom 9-pet carried roster enabled for this server.
features {
    ninePet {
        enabled = true
        enabled = ${?NINE_PET_ENABLED}
        maxCarried = 9
        maxCarried = ${?NINE_PET_MAX_CARRIED}

        progression {
            enabled = true
            enabled = ${?NINE_PET_PROGRESSION_ENABLED}
            unlockLevels = [40, 80, 120, 160, 200]
            rebirthUnlockAll = true
            rebirthUnlockAll = ${?NINE_PET_REBIRTH_UNLOCK_ALL}
        }
    }
}
