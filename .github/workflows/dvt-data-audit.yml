name: DVT data audit tools
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  markstep-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify DVT MarkStep parity audit and original byte fixtures
        run: python -m unittest discover -s tools -p test_dvt_markstep_parity.py -v
      - name: Audit all active quest blockers, mission step coordinates, and pending effects
        run: python -m unittest discover -s tools -p test_dvt_quest_blockers_20261011.py -v
      - name: Verify unsupported class13 reward code provenance and DAT mismatch
        run: python -m unittest discover -s tools -p test_dvt_class13_award_sources_20261011.py -v
      - name: Guard DEV quest item pStyle3 multi-stack reclamation from GitHub regressions
        run: python -m unittest discover -s tools -p test_dvt_pstyle3_live_quest_parity_20261011.py -v
      - name: Verify five source-proven Qin Tomb quest NPC auto-navigation targets
        run: python -m unittest discover -s tools -p test_dvt_12158_npc_navigation_20261011.py -v
      - name: Verify DVT quest10126 step4 original Dong Quan spy and palace route
        run: python -m unittest discover -s tools -p test_dvt_10126_dongquan_spy_navigation_20261012.py -v
      - name: Verify original source NPCs for quest10122 spy and quest10290 Dong Tam cave
        run: python -m unittest discover -s tools -p test_dvt_10122_10290_source_npc_navigation_20261012.py -v
      - name: Verify 20 poisoned-soldier 12106 medicine delivery NPC destinations
        run: python -m unittest discover -s tools -p test_dvt_12106_poisoned_soldier_navigation_20261012.py -v
      - name: Verify three source-proven Christmas quest merchant item waypoints
        run: python -m unittest discover -s tools -p test_dvt_12509_christmas_vendors_20261011.py -v
      - name: Verify quest12509 three-food turn-in at the genuine chef NPC15421
        run: python -m unittest discover -s tools -p test_dvt_12509_food_turnin_20261012.py -v
      - name: Verify quest12509 final stolen-thief return routes into original Santa scene-entry Eve9
        run: python -m unittest discover -s tools -p test_dvt_12509_santa_final_return_20261012.py -v
      - name: Verify original quest12509 ten-rods acquisition and correct-answer quiz NPCs
        run: python -m unittest discover -s tools -p test_dvt_12509_rod_collection_and_riddle_20261012.py -v
      - name: Verify quest12509 cave step12 original Eve unlocked door2 and alternative door3
        run: python -m unittest discover -s tools -p test_dvt_12509_cave_step12_door_20261012.py -v
      - name: Verify five original 12998 and 12936 festival relationship stage-gated NPC routes
        run: python -m unittest discover -s tools -p test_dvt_12998_12936_source_npc_navigation_20261012.py -v
      - name: Verify original stage12936 quest Door7 and stage17 NPC relationship
        run: python -m unittest discover -s tools -p test_dvt_12936_stage16_scene_entry_navigation_20261012.py -v
      - name: Verify quest12936 12509 12938 Door-trigger Eve routes never point to unrelated NPC
        run: python -m unittest discover -s tools -p test_dvt_quest_door_trigger_corrections_20261012.py -v
      - name: Verify original DVT Moon Rabbit mission entrance and nearest real battle NPC
        run: python -m unittest discover -s tools -p test_dvt_10852_rabbit_cave_navigation_20261012.py -v
      - name: Verify quest10852 source-backed return to original Ngô Cương NPC
        run: python -m unittest discover -s tools -p test_dvt_10852_rabbit_return_waypoint_20261012.py -v
      - name: Verify source-proven quest12162 30-pot return route without invented collection
        run: python -m unittest discover -s tools -p test_dvt_12162_clay_pot_turnin_20261012.py -v
      - name: Verify DVT 32043 exists in real BlissBag rewards and quest grants
        run: python -m unittest discover -s tools -p test_dvt_clay_pot_bag_sources_20261012.py -v
