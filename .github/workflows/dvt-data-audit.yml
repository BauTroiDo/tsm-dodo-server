name: DVT data audit tools
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  markstep-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify DVT MarkStep parity audit and original byte fixtures
        run: python -m unittest discover -s tools -p test_dvt_markstep_parity.py -v
      - name: Audit all active quest blockers, mission step coordinates, and pending effects
        run: python -m unittest discover -s tools -p test_dvt_quest_blockers_20261011.py -v
      - name: Verify unsupported class13 reward code provenance and DAT mismatch
        run: python -m unittest discover -s tools -p test_dvt_class13_award_sources_20261011.py -v
      - name: Guard DEV quest item pStyle3 multi-stack reclamation from GitHub regressions
        run: python -m unittest discover -s tools -p test_dvt_pstyle3_live_quest_parity_20261011.py -v
